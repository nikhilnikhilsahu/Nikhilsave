<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Return Notes 🔐</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(120deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(15px);
            max-width: 450px;
            margin: auto;
        }
        textarea, input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        textarea { height: 120px; }
        button {
            background: #ff9800; 
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #e68900; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Secure Return Notes 🔐 (Unique Password System)</h2>
        <textarea id="note" placeholder="Write your notes here..."></textarea>
        <input type="password" id="passwordInput" placeholder="Set Secure Password">
        <button onclick="saveEncryptedNote()">Save Securely</button>
        
        <br><br>
        <input type="password" id="unlockPassword" placeholder="Enter Password to Unlock">
        <button onclick="decryptNote()">Unlock Notes</button>

        <br><br>
        <button onclick="resetPassword()">Reset Password</button>
    </div>

    <script>
        function saveEncryptedNote() {
            let note = document.getElementById("note").value;
            let password = document.getElementById("passwordInput").value;
            let usedPasswords = JSON.parse(localStorage.getItem("usedPasswords")) || [];

            if (note.trim() === "" || password.trim() === "") {
                alert("Enter both note and password!");
                return;
            }

            if (usedPasswords.includes(password)) {
                alert("❌ This password is already used by someone else! Use another password.");
                return;
            }

            let encryptedNote = CryptoJS.AES.encrypt(note, password).toString();
            localStorage.setItem("secureNote", encryptedNote);
            localStorage.setItem("securePassword", password);
            usedPasswords.push(password);
            localStorage.setItem("usedPasswords", JSON.stringify(usedPasswords));

            alert("✅ Note saved securely!");
        }

        function decryptNote() {
            let password = document.getElementById("unlockPassword").value;
            let encryptedNote = localStorage.getItem("secureNote");
            let savedPassword = localStorage.getItem("securePassword");

            if (!encryptedNote || !savedPassword) {
                alert("❌ No saved notes found or password not set!");
                return;
            }

            if (password !== savedPassword) {
                alert("❌ Incorrect password!");
                return;
            }

            let bytes = CryptoJS.AES.decrypt(encryptedNote, password);
            let decryptedNote = bytes.toString(CryptoJS.enc.Utf8);

            if (decryptedNote) {
                document.getElementById("note").value = decryptedNote;
                alert("✅ Note Unlocked!");
            } else {
                alert("❌ Incorrect password!");
            }
        }

        function resetPassword() {
            localStorage.removeItem("securePassword");
            localStorage.removeItem("usedPasswords");
            alert("✅ Password reset successfully! Now set a new password.");
        }
    </script>
</body>
</html>
